[project]
name = "chordgen"
version = "0.1.0"
description = "音源を解析して CaT4G Song Format v1 (.cat4g.json) の下書きを出力する"
requires-python = ">=3.12,<3.13"
# torch / torchaudio は GPU ごとに別の配布元から入れるので、ここには書かない（portable/ のセットアップが入れる）
dependencies = [
    "numpy",
    "soundfile",
    "jsonschema>=4.18",
    "mutagen",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
chordgen = "chordgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chordgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
