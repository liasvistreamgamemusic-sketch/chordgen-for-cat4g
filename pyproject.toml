[project]
name = "chordgen"
version = "0.2.1"
description = "音源を解析して CaT4G Song Format v1 (.cat4g.json) の下書きを出力する"
requires-python = ">=3.12,<3.13"
# torch / torchaudio は GPU ごとに別の配布元から入れるので、ここには書かない（portable/ のセットアップが入れる）
dependencies = [
    "numpy",
    "soundfile",
    "jsonschema>=4.18",
    "mutagen",
]

[project.optional-dependencies]
# httpx は fastapi の TestClient が使う
dev = ["pytest", "httpx", "chordgen[gui]"]
# ブラウザで使う画面（python -m chordgen.gui）。ポータブル版は portable/requirements-gui.txt で入れる
gui = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]
# 解析に使うライブラリ。torch / torchaudio を先に入れてから入れる（PyPI の torch で上書きさせない）
analysis = [
    "demucs>=4.1.0,<5",
    "beat-this>=1.1,<2",
    "librosa>=0.11,<1.1",
    "openai-whisper==20250625",
    "stable-ts>=2.19,<2.20",
]
# 精度の比較（python -m chordgen.eval）
eval = ["mir_eval>=0.8"]

[project.scripts]
chordgen = "chordgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chordgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
